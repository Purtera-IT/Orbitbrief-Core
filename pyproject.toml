[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitbrief-core"
version = "0.1.0"
description = "Stage 2 runtime spine for OrbitBrief professional services"
# 3.12, not 3.11. Four f-string expressions in pm_handoff contain a
# backslash (render_markdown 1090/1224, question_generators 1231/1313),
# which PEP 701 only legalised in 3.12 -- so this package has never been
# importable on 3.11. orbitbrief-core-worker ships python:3.12-slim, so
# nothing was ever broken in production; the declaration was simply
# untrue, and a >=3.11 install would fail at import.
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
  "PyYAML>=6.0.1",
  "openpyxl>=3.1.2",
  "jsonschema>=4.23.0",
  # Phase-1 evidence_runtime backend: single-file embedded SQL with JSON
  # support. We pin the major to keep the on-disk file format stable.
  "duckdb>=1.0,<2.0",
  # parser-os: Phase-0 seam. Source of truth for EvidenceAtom, SourceRef,
  # CompileResult, Manifest, and the orbitbrief.input.v2 envelope.
  #
  # On the Mac SSH host (original target), the editable file:// URL
  # below resolves and parser-os imports work out of the box.
  # On any other platform, install parser-os separately:
  #     pip install -e <path-to-parser-os-repo>
  # and point compile_brief at it via:
  #     export PARSER_OS_ROOT=<path-to-parser-os-repo>
  "purtera-evidence-mvp @ file:///Users/purtera/dev/purtera/parser-os-repo ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "import-linter>=2.0",
  "httpx>=0.27.0",  # FastAPI TestClient
]
ui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Phase 3 — the world_model registry ships its YAML alongside the code.
"orbitbrief_core.world_model.data" = ["*.yaml"]
# Phase 7.5 — the briefing brains ship their per-domain configs.
"orbitbrief_core.brains.data" = ["*.yaml"]
# Phase 8 — the reviewer UI ships its Jinja templates.
"orbitbrief_core.review_ui" = ["templates/*.html"]
# The question-quality head ships its trained artifact. The dev worker runs off
# PYTHONPATH so it loads either way, but a wheel build without this silently
# drops the model and the head degrades to its structural fallback — a ~9pp
# regression in queue quality that nothing would report.
"orbitbrief_core.pm_handoff" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
