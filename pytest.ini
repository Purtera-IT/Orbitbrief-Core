[pytest]
# Phase 1 layout: only the new envelope-consumer + evidence-runtime
# test trees plus the Phase-0 contract tests at the top level.
testpaths =
    tests
pythonpath =
    src

# Tests that call a real model are integration tests, not the default (PUR-152).
# With a model reachable they made the suite take 54 minutes, and on a machine
# where one happens to answer (a local Ollama) they turned an ordinary run into
# a long, silent stall. Run them on purpose:
#     pytest -m live
markers =
    live: calls a real model or network service; deselected by default, run with -m live

addopts = -m "not live"

# A per-test ceiling (pytest-timeout) turns a stall into a failure that names the
# test. Generous for unit tests; `pytest -m live` runs should pass --timeout=0 or
# a larger value, since one real planner call can take minutes.
timeout = 120
